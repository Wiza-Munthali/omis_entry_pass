<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Your OMIS Entry code</title>
  </head>
  <!-- Colours are the design tokens from docs/SPEC.md (bg, surface, ink, text-muted, brand-soft, brand-strong). -->
  <body style="margin:0;padding:0;background:#EEEEEA;font-family:Inter,Segoe UI,Helvetica,Arial,sans-serif;color:#1A1A1A;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#EEEEEA;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width:600px;width:100%;background:#FFFFFF;border-radius:24px;">
            <tr>
              <td style="padding:32px 32px 8px;">
                <p style="margin:0;font-size:14px;line-height:20px;font-weight:600;color:#1F9E7E;">OMIS Entry</p>
                <h1 style="margin:8px 0 0;font-size:28px;line-height:34px;font-weight:600;color:#111111;">Your sign-in code</h1>
              </td>
            </tr>
            <tr>
              <td style="padding:16px 32px;">
                <p style="margin:0 0 16px;font-size:16px;line-height:24px;">Enter this code on the OMIS Entry page to get your gate pass.</p>
                <p style="margin:0;padding:16px 24px;background:#DDF5EF;border-radius:24px;font-size:32px;line-height:40px;font-weight:600;letter-spacing:8px;color:#111111;text-align:center;">{{ .Token }}</p>
              </td>
            </tr>
            <tr>
              <td style="padding:8px 32px 32px;">
                <p style="margin:0;font-size:14px;line-height:20px;color:#6B6B6B;">The code expires in one hour. If you didn't ask for it, you can ignore this email.</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
